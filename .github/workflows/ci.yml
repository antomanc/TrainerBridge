name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Host regression tests (ASan + UBSan)
        run: make sanitize

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned ESP32 core and NimBLE-Arduino
        run: make deps
      - name: Compile firmware
        run: make compile
